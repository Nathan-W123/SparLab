name: build-and-verify

# Three jobs, each answering one question:
#   build-and-test   does it compile warning-clean on GCC and Clang, and do the
#                    tests pass?
#   verify           do the verification and validation studies still meet their
#                    documented tolerances?
#   benchmark        does a full topology-optimisation benchmark still run end to
#                    end and produce its figures?
#
# The verify job is the one that can catch a numerical regression, so it uploads
# its summary either way.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build and test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libeigen3-dev catch2

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"   >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc"   >> "$GITHUB_ENV"
            echo "CXX=g++"  >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSPARLAB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        # The Debug build runs Eigen's own assertions, which is slow but is the
        # configuration most likely to catch an indexing mistake.
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

  verify:
    name: verification and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libeigen3-dev catch2

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"

      - name: Run the studies
        # sparlab_verify exits non-zero if any study misses its documented
        # tolerance, so this step is the numerical regression gate.
        run: ./scripts/run_verification.sh results/verification

      - name: Upload the verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-summary
          path: results/verification/

  benchmark:
    name: benchmark smoke test and figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libeigen3-dev catch2
          python3 -m pip install --quiet numpy pandas matplotlib pillow scikit-fem

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"

      - name: Static and modal analysis (2-D and 3-D)
        run: |
          ./build/bin/sparlab_solve --config configs/verification/cantilever_analysis.json \
                                    --output results/cantilever_analysis --export-calculix
          ./build/bin/sparlab_solve --config configs/verification/block_3d_analysis.json \
                                    --output results/block_3d_analysis --export-calculix

      - name: Cross-validation against scikit-fem
        # CalculiX is not installed on the runner, so only the scikit-fem
        # comparison runs; it exits non-zero if a displacement field differs
        # beyond the documented tolerance.
        run: |
          python3 python/scripts/cross_validate.py --skip-calculix \
              --case results/cantilever_analysis --case results/block_3d_analysis \
              --output results/cross_validation

      - name: Topology optimization on reduced meshes
        # The committed decks run for several hundred iterations on fine
        # meshes. CI runs the same decks at a fraction of the resolution and a
        # shorter budget: enough to exercise the whole pipeline - OC and MMA,
        # the stress constraint, the Hex8 path, the modal comparison of the
        # interpreted topology and the geometry export - in a few minutes.
        run: |
          ./build/bin/sparlab_topopt \
            --config configs/benchmarks/cantilever_beam.json \
            --output results/cantilever_beam \
            --nx 80 --ny 40 --max-iterations 60 --modes 4
          ./build/bin/sparlab_topopt \
            --config configs/benchmarks/l_bracket_stress.json \
            --output results/l_bracket_stress \
            --nx 32 --ny 32 --max-iterations 40
          ./build/bin/sparlab_topopt \
            --config configs/benchmarks/l_bracket_stress.json \
            --output results/l_bracket_unconstrained \
            --nx 32 --ny 32 --max-iterations 40 --no-stress
          ./build/bin/sparlab_topopt \
            --config configs/benchmarks/bracket_3d.json \
            --output results/bracket_3d \
            --nx 16 --ny 8 --nz 4 --max-iterations 20 --modes 4

      - name: Runtime scaling (small sizes)
        run: |
          ./build/bin/sparlab_bench --sizes 20,40,80 --repeats 1 --output results/benchmark
          ./build/bin/sparlab_bench --dim 3 --sizes 8,16 --repeats 1 --output results/benchmark

      - name: Regenerate figures and tables
        run: |
          for case in cantilever_analysis block_3d_analysis cantilever_beam \
                      l_bracket_stress bracket_3d; do
            python3 python/scripts/plot_case.py --case results/$case \
                                                --figures ci-figures --no-animation
          done
          python3 python/scripts/plot_comparison.py \
              --constrained results/l_bracket_stress \
              --unconstrained results/l_bracket_unconstrained --figures ci-figures
          python3 python/scripts/plot_verification.py \
              --verification results/verification --benchmark results/benchmark \
              --cross-validation results/cross_validation \
              --figures ci-figures || true
          python3 python/scripts/write_result_tables.py --results results \
                                                        --output ci-figures/tables

      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-figures
          path: ci-figures/
